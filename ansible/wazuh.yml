---
# Wazuh SIEM / EDR Installation Playbook
# Installs Wazuh Manager, Sysmon, and Wazuh Agents when selected in config.json
# "edr" on each host (default: wazuh + sysmon)
# Credits to SOCFortress, Mayfly277, and MITRE ATT&CK community

- import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: Install and configure Wazuh Manager with current detection rules
  hosts: wazuh_server
  become: yes
  roles:
    - { role: 'wazuh_manager', tags: 'wazuh_manager' }

- name: Install Sysmon on hosts that selected wazuh or sysmon
  hosts: sysmon
  roles:
    - { role: 'sysmon', tags: 'sysmon', when: "('sysmon' in (lab.hosts[dict_key].edr | default(['wazuh', 'sysmon']))) or ('wazuh' in (lab.hosts[dict_key].edr | default(['wazuh', 'sysmon'])))" }

- name: Install Wazuh Agent on Windows machines that selected wazuh
  hosts: wazuh_agents
  roles:
    - { role: 'wazuh_agent', tags: 'wazuh_agent', when: "'wazuh' in (lab.hosts[dict_key].edr | default(['wazuh', 'sysmon']))" }
  vars:
    wazuh_manager_host: "{{ hostvars['wazuh']['ansible_host'] | default('') }}"
