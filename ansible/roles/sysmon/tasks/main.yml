# Sysmon Installation for Wazuh EDR Integration
# Optimized for MITRE ATT&CK detection

- name: Create Sysmon directory
  ansible.windows.win_file:
    path: "{{ sysmon_install_location }}"
    state: directory

- name: Download Sysmon from Microsoft Sysinternals
  ansible.windows.win_get_url:
    url: "{{ sysmon_download_url }}"
    dest: "{{ sysmon_install_location }}\\Sysmon.zip"
  register: sysmon_download
  until: sysmon_download is succeeded
  retries: 3
  delay: 5

- name: Unzip Sysmon
  community.windows.win_unzip:
    src: "{{ sysmon_install_location }}\\Sysmon.zip"
    dest: "{{ sysmon_install_location }}"
    delete_archive: no

- name: Copy Sysmon configuration for Wazuh
  ansible.windows.win_copy:
    src: "{{ sysmon_config_file }}"
    dest: "{{ sysmon_install_location }}\\{{ sysmon_config_file }}"

- name: Check if Sysmon service exists
  ansible.windows.win_service:
    name: Sysmon64
  register: sysmon_service
  ignore_errors: yes

- name: Install Sysmon with configuration
  ansible.windows.win_command: >
    {{ sysmon_install_location }}\Sysmon64.exe -accepteula -i {{ sysmon_install_location }}\{{ sysmon_config_file }}
  args:
    chdir: "{{ sysmon_install_location }}"
  when: sysmon_service.state is not defined or sysmon_service.name is not defined

- name: Update Sysmon configuration if already installed
  ansible.windows.win_command: >
    {{ sysmon_install_location }}\Sysmon64.exe -c {{ sysmon_install_location }}\{{ sysmon_config_file }}
  args:
    chdir: "{{ sysmon_install_location }}"
  when: sysmon_service.state is defined and sysmon_service.name is defined

- name: Ensure Sysmon service is running
  ansible.windows.win_service:
    name: Sysmon64
    state: started
    start_mode: auto
