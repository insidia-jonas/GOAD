- name: "Force a DNS on the adapter {{nat_adapter}}"
  ansible.windows.win_dns_client:
    adapter_names: "{{nat_adapter}}"
    dns_servers: 
      - "{{hostvars[dns_domain].ansible_host}}"
      - "{{dns_server}}"
  when: force_dns_server == "yes"

- name: Set a proxy for specific protocols
  community.windows.win_http_proxy:
    proxy:
      http: "{{ad_http_proxy}}"
      https: "{{ad_https_proxy}}"
  when: http_proxy == "yes"

- name: Configure IE to use a specific proxy per protocol
  community.windows.win_inet_proxy:
    proxy:
      http: "{{ad_http_proxy}}"
      https: "{{ad_https_proxy}}"
  when: http_proxy == "yes"

# PowerShellGet setup - only on Server 2016+ (Server OS with PS 5.0+)
- name: Install NuGet provider (Server 2016+)
  ansible.windows.win_shell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
    $nuget = Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue
    if (-not $nuget -or $nuget.Version -lt [Version]"2.8.5.201") {
      Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
      "CHANGED"
    } else {
      "OK"
    }
  register: nuget_result
  changed_when: "'CHANGED' in nuget_result.stdout"
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

- name: Trust PSGallery repository (Server 2016+)
  ansible.windows.win_shell: |
    $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
    if ($repo.InstallationPolicy -ne 'Trusted') {
      Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      "CHANGED"
    } else {
      "OK"
    }
  register: psgallery_result
  changed_when: "'CHANGED' in psgallery_result.stdout"
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

# DSC modules - only on Windows Server 2016+ (not Windows Client, not 2012 R2)
- name: Windows Server | Install ComputerManagementDsc Powershell module
  ansible.windows.win_shell: |
    $module = Get-Module -ListAvailable -Name ComputerManagementDsc -ErrorAction SilentlyContinue
    if (-not $module) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Install-Module -Name ComputerManagementDsc -Force -SkipPublisherCheck
      "CHANGED"
    } else {
      "OK"
    }
  register: cmdsc_result
  changed_when: "'CHANGED' in cmdsc_result.stdout"
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

- name: Windows Server | Enable Remote Desktop via DSC
  win_dsc:
    resource_name: RemoteDesktopAdmin
    IsSingleInstance : 'yes'
    Ensure: present
    UserAuthentication: Secure
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

# Legacy method for Windows Client (10/11) and Server 2012 R2
- name: Windows Client/Legacy | Enable Remote Desktop via Registry
  win_shell: |
    Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
  when: ansible_os_product_type != "Server" or ansible_distribution_version is version('10.0', '<')

# xNetworking module - only on Windows Server 2016+
- name: Windows Server | Install xNetworking Powershell module
  ansible.windows.win_shell: |
    $module = Get-Module -ListAvailable -Name xNetworking -ErrorAction SilentlyContinue
    if (-not $module) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Install-Module -Name xNetworking -Force -SkipPublisherCheck
      "CHANGED"
    } else {
      "OK"
    }
  register: xnet_result
  changed_when: "'CHANGED' in xnet_result.stdout"
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

- name: Windows Server | Allow RDP through Firewall via DSC
  win_dsc:
    resource_name: xFirewall
    Name: "Administrator access for RDP (TCP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "3389"
    Protocol: "TCP"
    Description: "Opens the listener port for RDP"
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')

# Legacy method for Windows Client (10/11) and Server 2012 R2
- name: Windows Client/Legacy | Allow RDP through Firewall via netsh
  win_shell: |
    netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
  when: ansible_os_product_type != "Server" or ansible_distribution_version is version('10.0', '<')

- name: Add a network static route
  community.windows.win_route:
    destination: "{{route_network}}"
    gateway: "{{route_gateway}}"
    metric: 1
    state: present
  when: add_route == "yes"
