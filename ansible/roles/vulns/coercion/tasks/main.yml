# Coercion Attack Enablement
# Enables WebClient service and other services for PetitPotam, PrinterBug, etc.
# https://github.com/topotam/PetitPotam
# https://github.com/leechristensen/SpoolSample

# WebDAV-Redirector feature - only on Windows Server 2016+ (not 2012 R2)
- name: Ensure WebDAV Redirector is installed (Server 2016+)
  ansible.windows.win_feature:
    name: WebDAV-Redirector
    state: present
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')
  register: webdav_install

# Reboot if WebDAV feature was just installed (required for WebClient service to be available)
- name: Reboot after WebDAV-Redirector installation
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when:
    - ansible_os_product_type == "Server"
    - webdav_install is defined
    - webdav_install.changed | default(false)

# Check if WebClient service exists on ALL hosts (unified check)
- name: Check if WebClient service exists
  ansible.windows.win_shell: |
    $svc = Get-Service -Name WebClient -ErrorAction SilentlyContinue
    if ($svc) { "EXISTS" } else { "NOTEXISTS" }
  register: webclient_service_check
  changed_when: false

# Reboot servers if WebDAV feature is installed but WebClient service doesn't exist yet
- name: Reboot server to complete WebDAV-Redirector installation (service not yet available)
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when:
    - ansible_os_product_type == "Server"
    - ansible_distribution_version is version('10.0', '>=')
    - webclient_service_check.stdout is defined
    - "'NOTEXISTS' in webclient_service_check.stdout"
  register: server_rebooted

# Re-check after reboot on servers
- name: Re-check if WebClient service exists after reboot
  ansible.windows.win_shell: |
    $svc = Get-Service -Name WebClient -ErrorAction SilentlyContinue
    if ($svc) { "EXISTS" } else { "NOTEXISTS" }
  register: webclient_service_recheck
  changed_when: false
  when: server_rebooted is changed

# Enable WebClient service - only if service exists
- name: Enable WebClient service (if available)
  ansible.windows.win_service:
    name: WebClient
    start_mode: auto
    state: started
  when:
    - ansible_distribution_version is version('10.0', '>=')
    - ("'EXISTS' in webclient_service_check.stdout") or
      (webclient_service_recheck.stdout is defined and "'EXISTS' in webclient_service_recheck.stdout")

# Print Spooler and Remote Registry available on all Windows versions
- name: Enable Print Spooler service (for PrinterBug/SpoolSample)
  ansible.windows.win_service:
    name: Spooler
    start_mode: auto
    state: started

- name: Ensure Remote Registry is enabled (for remote enumeration)
  ansible.windows.win_service:
    name: RemoteRegistry
    start_mode: auto
    state: started
