---
- name: Skip Sophos Endpoint when no installer was provided
  debug:
    msg: >
      Sophos Endpoint was selected for {{ inventory_hostname }} but no installer
      was provided. Set sophos_endpoint_installer_url or sophos_endpoint_installer_src
      (see docs/mkdocs/docs/extensions/edr.md).
  when:
    - (sophos_endpoint_installer_url | default('') | length) == 0
    - (sophos_endpoint_installer_src | default('') | length) == 0

- name: Install Sophos Endpoint
  when: (sophos_endpoint_installer_url | default('') | length) > 0 or (sophos_endpoint_installer_src | default('') | length) > 0
  block:
    - name: Create Sophos installer directory
      win_file:
        path: C:\setup\sophos
        state: directory

    - name: Download Sophos Endpoint installer
      win_get_url:
        url: "{{ sophos_endpoint_installer_url }}"
        dest: "{{ sophos_endpoint_installer_dest }}"
      when: (sophos_endpoint_installer_url | default('') | length) > 0

    - name: Copy Sophos Endpoint installer from the control node
      win_copy:
        src: "{{ sophos_endpoint_installer_src }}"
        dest: "{{ sophos_endpoint_installer_dest }}"
      when:
        - (sophos_endpoint_installer_url | default('') | length) == 0
        - (sophos_endpoint_installer_src | default('') | length) > 0

    - name: Check if Sophos Endpoint service already exists
      win_service:
        name: Sophos Endpoint Defense
      register: sophos_svc
      failed_when: false

    - name: Run Sophos Endpoint installer
      win_command: "{{ sophos_endpoint_installer_dest }} {{ sophos_endpoint_install_args }}"
      when: sophos_svc.exists is not defined or not sophos_svc.exists
      register: sophos_install
      failed_when: sophos_install.rc not in [0, 3010]
