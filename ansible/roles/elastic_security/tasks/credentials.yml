---
- name: Generate or reuse Elasticsearch user secrets
  ansible.builtin.shell: |
    set -euo pipefail
    CRED="{{ elastic_credentials_file }}"
    if [ -s "$CRED" ]; then
      exit 0
    fi
    parse() {
      /usr/share/elasticsearch/bin/elasticsearch-reset-password -u "$1" -b -a \
        | awk '/New value:/ { print $NF; exit }'
    }
    ELASTIC_PW="$(parse elastic)"
    KIBANA_PW="$(parse kibana_system)"
    if [ -z "${ELASTIC_PW}" ] || [ -z "${KIBANA_PW}" ]; then
      echo "failed to reset built-in users" >&2
      exit 1
    fi
    umask 077
    printf 'ELASTIC_PASSWORD=%s\nKIBANA_SYSTEM_PASSWORD=%s\n' "$ELASTIC_PW" "$KIBANA_PW" > "$CRED"
    chmod 600 "$CRED"
  args:
    executable: /bin/bash
  no_log: true
  retries: 12
  delay: 10
  register: elastic_cred_init

- name: Parse local Elastic secrets
  ansible.builtin.command: python3 -c "from pathlib import Path; vals=dict(l.split('=',1) for l in Path('{{ elastic_credentials_file }}').read_text().splitlines() if '=' in l); print(vals.get('ELASTIC_PASSWORD','')); print(vals.get('KIBANA_SYSTEM_PASSWORD',''))"
  register: elastic_cred_parsed
  changed_when: false
  no_log: true

- name: Store parsed Elastic secrets
  ansible.builtin.set_fact:
    elastic_user_secret: "{{ elastic_cred_parsed.stdout_lines[0] | default('') }}"
    elastic_kibana_system_secret: "{{ elastic_cred_parsed.stdout_lines[1] | default('') }}"
  no_log: true

- name: Require Elastic secrets
  ansible.builtin.assert:
    that:
      - elastic_user_secret | length > 0
      - elastic_kibana_system_secret | length > 0
    fail_msg: "Elastic user secrets were not written to {{ elastic_credentials_file }}"
  no_log: true

- name: Start Elastic 30-day trial
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ elastic_es_port }}/_license/start_trial?acknowledge=true"
    method: POST
    user: elastic
    password: "{{ elastic_user_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 403]
  no_log: true
  register: elastic_trial
  retries: 5
  delay: 5

- name: Record trial result
  ansible.builtin.copy:
    dest: "{{ elastic_data_dir }}/.trial_started"
    mode: "0644"
    content: |
      started={{ (elastic_trial.json.trial_was_started | default(false)) | string }}
      acknowledged={{ (elastic_trial.json.acknowledged | default(false)) | string }}

- name: Read Elasticsearch version
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ elastic_es_port }}/"
    method: GET
    user: elastic
    password: "{{ elastic_user_secret }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  no_log: true
  register: elastic_root

- name: Set stack version fact
  ansible.builtin.set_fact:
    elastic_stack_version: "{{ elastic_root.json.version.number | default(elastic_agent_fallback_version) }}"
