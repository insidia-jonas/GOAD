- name: "Prepare to trust flush and renew dns"
  win_shell: |
    ipconfig /flushdns
    ipconfig /renew

# Use netdom.exe to create forest trust - avoids PowerShell remoting crash on Server 2022
- name: Check if trust already exists
  win_shell: |
    $trust = Get-ADTrust -Filter "Target -eq '{{remote_forest}}'" -ErrorAction SilentlyContinue
    if ($trust) { "EXISTS" } else { "NOTEXISTS" }
  register: trust_check
  changed_when: false

- name: Add trusts between domain using netdom
  win_shell: |
    netdom trust "{{domain}}" /Domain:"{{remote_forest}}" /TwoWay /Transitive /ADD /UserD:"{{remote_admin}}" /PasswordD:"{{remote_admin_password}}" /UserO:"{{domain_username}}" /PasswordO:"{{domain_password}}"
  register: trust_result
  when: trust_check.stdout is search("NOTEXISTS")
  changed_when: trust_result.rc == 0

- name: "Reboot and wait for the AD system to restart"
  win_reboot:
    test_command: "Get-ADUser -Identity Administrator -Properties *"
  when: trust_result.changed | default(false)


