- name: enable the {{domain_adapter}} interface (local) for DNS client requests
  ansible.windows.win_shell: dnscmd . /resetlistenaddresses {{ hostvars[dict_key].ansible_host }}
  when: two_adapters

# Fix for "AcceptLicense parameter not found" - install NuGet provider and configure PSGallery first
- name: Install NuGet provider
  ansible.windows.win_shell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
    $nuget = Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue
    if (-not $nuget -or $nuget.Version -lt [Version]"2.8.5.201") {
      Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
      "CHANGED"
    } else {
      "OK"
    }
  register: nuget_result
  changed_when: "'CHANGED' in nuget_result.stdout"

- name: Trust PSGallery repository
  ansible.windows.win_shell: |
    $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
    if ($repo.InstallationPolicy -ne 'Trusted') {
      Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      "CHANGED"
    } else {
      "OK"
    }
  register: psgallery_result
  changed_when: "'CHANGED' in psgallery_result.stdout"

- name: Install xDnsServer Powershell module
  ansible.windows.win_shell: |
    $module = Get-Module -ListAvailable -Name xDnsServer -ErrorAction SilentlyContinue
    if (-not $module) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Install-Module -Name xDnsServer -Force -SkipPublisherCheck
      "CHANGED"
    } else {
      "OK"
    }
  register: xdns_result
  changed_when: "'CHANGED' in xdns_result.stdout"

# add external dns forwarder
- name: Configure DNS Forwarders
  win_dsc:
    resource_name: xDnsServerForwarder
    IsSingleInstance: "yes"
    UseRootHint: false
    IPAddresses:
      - "{{dns_server_forwarder}}"

- name: Install ActiveDirectoryDSC Powershell module
  ansible.windows.win_shell: |
    $module = Get-Module -ListAvailable -Name ActiveDirectoryDSC -ErrorAction SilentlyContinue
    if (-not $module) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Install-Module -Name ActiveDirectoryDSC -Force -SkipPublisherCheck
      "CHANGED"
    } else {
      "OK"
    }
  register: addsc_result
  changed_when: "'CHANGED' in addsc_result.stdout"

# issue 156
- name: enable the Active directory web services if not enabled
  ansible.windows.win_shell: Set-Service -Name adws -StartupType Automatic
