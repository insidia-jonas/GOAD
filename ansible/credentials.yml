---
# Credentials Output Playbook
# Displays all credentials at the end of deployment

- name: Display GOAD Lab Credentials
  hosts: localhost
  gather_facts: no
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tasks:
    - name: Load lab configuration
      include_vars:
        file: "{{ data_path }}config.json"
        name: lab

    - name: Display Domain Credentials
      debug:
        msg: |

          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                         GOAD LAB CREDENTIALS                                  ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║                                                                               ║
          ║  DOMAIN ADMIN CREDENTIALS                                                     ║
          ║  ════════════════════════                                                     ║
          ║                                                                               ║
          ║  sevenkingdoms.local                                                          ║
          ║    - Administrator: {{ lab.lab.domains['sevenkingdoms.local'].domain_password }}
          ║    - Domain Admins: cersei.lannister, robert.baratheon                        ║
          ║                                                                               ║
          ║  north.sevenkingdoms.local                                                    ║
          ║    - Administrator: {{ lab.lab.domains['north.sevenkingdoms.local'].domain_password }}
          ║    - Domain Admins: eddard.stark                                              ║
          ║                                                                               ║
          ║  essos.local                                                                  ║
          ║    - Administrator: {{ lab.lab.domains['essos.local'].domain_password }}
          ║    - Domain Admins: daenerys.targaryen                                        ║
          ║                                                                               ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║                                                                               ║
          ║  LOCAL ADMIN PASSWORDS                                                        ║
          ║  ══════════════════════                                                       ║
          ║                                                                               ║
          ║  dc01 (kingslanding)  : {{ lab.lab.hosts.dc01.local_admin_password }}
          ║  dc02 (winterfell)    : {{ lab.lab.hosts.dc02.local_admin_password }}
          ║  dc03 (meereen)       : {{ lab.lab.hosts.dc03.local_admin_password }}
          ║  srv02 (castelblack)  : {{ lab.lab.hosts.srv02.local_admin_password }}
          ║  srv03 (braavos)      : {{ lab.lab.hosts.srv03.local_admin_password }}
          ║  srv04 (legacy 2012)  : {{ lab.lab.hosts.srv04.local_admin_password }}
          ║  ws01 (harrenhal)     : {{ lab.lab.hosts.ws01.local_admin_password | default('W1nd0ws11!') }}
          ║  ws02 (theeyrie)      : {{ lab.lab.hosts.ws02.local_admin_password }}
          ║                                                                               ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║                                                                               ║
          ║  ANSIBLE CONNECTION                                                           ║
          ║  ══════════════════                                                           ║
          ║                                                                               ║
          ║  Windows (WinRM): localuser / password                                        ║
          ║  Linux (SSH)    : debian / debian  (Ludus) · vagrant (VirtualBox/VMware)      ║
          ║  Perimeter      : Debian router .53  (or Sophos XGS if extension is on)       ║
          ║                                                                               ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║                                                                               ║
          ║  WAZUH EDR                                                                    ║
          ║  ═════════                                                                    ║
          ║                                                                               ║
          ║  Dashboard: https://wazuh:443                                                 ║
          ║  Username : admin                                                             ║
          ║  Password : SecurePassword123!                                                ║
          ║                                                                               ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║                                                                               ║
          ║  EXAMPLE RDP COMMANDS                                                         ║
          ║  ═══════════════════                                                          ║
          ║                                                                               ║
          ║  xfreerdp /v:dc01 /u:sevenkingdoms\\administrator /p:{{ lab.lab.domains['sevenkingdoms.local'].domain_password }}
          ║  xfreerdp /v:dc02 /u:north\\administrator /p:{{ lab.lab.domains['north.sevenkingdoms.local'].domain_password }}
          ║  xfreerdp /v:dc03 /u:essos\\administrator /p:{{ lab.lab.domains['essos.local'].domain_password }}
          ║                                                                               ║
          ╚══════════════════════════════════════════════════════════════════════════════╝

    - name: Write credentials to file
      copy:
        content: |
          # GOAD LAB CREDENTIALS
          # Generated on {{ ansible_date_time.iso8601 | default('deployment') }}

          ## Domain Admin Credentials

          | Domain | Password | Domain Admins |
          |--------|----------|---------------|
          | sevenkingdoms.local | {{ lab.lab.domains['sevenkingdoms.local'].domain_password }} | administrator, cersei.lannister, robert.baratheon |
          | north.sevenkingdoms.local | {{ lab.lab.domains['north.sevenkingdoms.local'].domain_password }} | administrator, eddard.stark |
          | essos.local | {{ lab.lab.domains['essos.local'].domain_password }} | administrator, daenerys.targaryen |

          ## Local Admin Passwords

          | Server | Hostname | Password |
          |--------|----------|----------|
          | dc01 | kingslanding | {{ lab.lab.hosts.dc01.local_admin_password }} |
          | dc02 | winterfell | {{ lab.lab.hosts.dc02.local_admin_password }} |
          | dc03 | meereen | {{ lab.lab.hosts.dc03.local_admin_password }} |
          | srv02 | castelblack | {{ lab.lab.hosts.srv02.local_admin_password }} |
          | srv03 | braavos | {{ lab.lab.hosts.srv03.local_admin_password }} |
          | srv04 | legacy | {{ lab.lab.hosts.srv04.local_admin_password }} |
          | ws01 | harrenhal | {{ lab.lab.hosts.ws01.local_admin_password | default('W1nd0ws11!') }} |
          | ws02 | theeyrie | {{ lab.lab.hosts.ws02.local_admin_password }} |

          ## Ansible Connection

          - Windows (WinRM): localuser / password
          - Linux (SSH): debian / debian

          ## Wazuh EDR

          - Dashboard: https://wazuh:443
          - Username: admin
          - Password: SecurePassword123!

          ## Example RDP Commands

          ```bash
          xfreerdp /v:dc01 /u:sevenkingdoms\\administrator /p:{{ lab.lab.domains['sevenkingdoms.local'].domain_password }}
          xfreerdp /v:dc02 /u:north\\administrator /p:{{ lab.lab.domains['north.sevenkingdoms.local'].domain_password }}
          xfreerdp /v:dc03 /u:essos\\administrator /p:{{ lab.lab.domains['essos.local'].domain_password }}
          ```
        dest: "{{ data_path }}credentials.md"
      delegate_to: localhost

    - name: Display credentials file location
      debug:
        msg: "Credentials saved to: {{ data_path }}credentials.md"
