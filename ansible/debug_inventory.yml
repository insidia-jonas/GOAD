---
# Debug playbook to validate inventory and variable configuration
# Usage: ansible-playbook -i <inventory1> -i <inventory2> debug_inventory.yml
#
# This playbook checks:
# - All hosts are reachable
# - dict_key is defined for each host
# - lab configuration is loaded correctly
# - hostname and domain variables are accessible

- name: "Load data files"
  import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Debug inventory configuration"
  hosts: domain
  gather_facts: no
  tasks:
    - name: "Check if dict_key is defined"
      debug:
        msg: "Host {{ inventory_hostname }} - dict_key: {{ dict_key | default('UNDEFINED!') }}"

    - name: "Check if ansible_host is defined"
      debug:
        msg: "Host {{ inventory_hostname }} - ansible_host: {{ ansible_host | default('UNDEFINED!') }}"

    - name: "Validate dict_key is not a template"
      fail:
        msg: "ERROR: dict_key contains unrendered template: {{ dict_key }}"
      when: dict_key is defined and '{{' in dict_key

    - name: "Validate ansible_host is not a template"
      fail:
        msg: "ERROR: ansible_host contains unrendered template '{{ip_range}}' - Run scripts/generate_inventory.sh first!"
      when: ansible_host is defined and '{{' in ansible_host

    - name: "Check lab.hosts configuration"
      debug:
        msg: |
          Host: {{ inventory_hostname }}
          dict_key: {{ dict_key | default('UNDEFINED') }}
          Config exists: {{ (lab.hosts[dict_key] is defined) | default(false) }}
          Hostname: {{ lab.hosts[dict_key].hostname | default('UNDEFINED') }}
          Domain: {{ lab.hosts[dict_key].domain | default('UNDEFINED') }}
          Local Admin Password: {{ lab.hosts[dict_key].local_admin_password | default('UNDEFINED') | regex_replace('.', '*') }}
      when: dict_key is defined and lab is defined

    - name: "FAIL if dict_key is not in lab.hosts"
      fail:
        msg: |
          ERROR: dict_key '{{ dict_key }}' not found in lab.hosts configuration!
          Available keys: {{ lab.hosts.keys() | list }}

          This usually means:
          1. The inventory file is missing dict_key for this host
          2. The config.json doesn't have an entry for '{{ dict_key }}'
      when:
        - dict_key is defined
        - lab is defined
        - lab.hosts[dict_key] is not defined

- name: "Test WinRM connectivity"
  hosts: domain
  gather_facts: no
  tasks:
    - name: "Ping Windows host via WinRM"
      win_ping:
      register: ping_result
      ignore_errors: yes

    - name: "Report connectivity status"
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}): {{ 'OK' if ping_result is succeeded else 'FAILED - ' + (ping_result.msg | default('unknown error')) }}"
