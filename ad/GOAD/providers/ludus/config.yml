ludus:
  # Windows Server 2025 with TPM support
  - vm_name: "{{ range_id }}-GOAD-DC01"
    hostname: "{{ range_id }}-DC01"
    template: win2025-server-x64-tpm-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-GOAD-DC02"
    hostname: "{{ range_id }}-DC02"
    template: win2025-server-x64-tpm-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-GOAD-DC03"
    hostname: "{{ range_id }}-DC03"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-GOAD-SRV02"
    hostname: "{{ range_id }}-SRV02"
    template: win2025-server-x64-tpm-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 6
    cpus: 2
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-GOAD-SRV03"
    hostname: "{{ range_id }}-SRV03"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 23
    ram_gb: 5
    cpus: 2
    windows:
      sysprep: true
  # NOTE: Windows Server 2008 R2 requires MANUAL setup in Ludus
  # See: https://docs.ludus.cloud/docs/templates/#windows-2008-r2-x64
  # After manual VM creation, add to inventory with IP: x.x.x.24
  # The VM is excluded from Wazuh and Sysmon (not compatible)
  - vm_name: "{{ range_id }}-GOAD-WS02"
    hostname: "{{ range_id }}-WS02"
    template: win10-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 32
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-GOAD-WAZUH"
    hostname: "{{ range_id }}-WAZUH"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 51
    ram_gb: 8
    cpus: 2
    linux: true
